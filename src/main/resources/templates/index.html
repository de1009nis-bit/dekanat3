<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartQueue — очередь деканата</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>

        body {
            background: #ebe5d9;
            color: #05664a;
        }

        .navbar {
            background: #3e2b2e;
        }

        .main-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3e2b2e;
        }

        .ticket-number {
            font-weight: 700;
            color: #3e2b2e;
        }

        .urgent {
            color: #b91c1c;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
        }

    </style>
</head>

<body>
<nav class="navbar navbar-dark">
    <div class="container py-2">
        <a class="navbar-brand fw-bold" href="/">
            ВозьмиТалон
        </a>
        <span style="color: #ebe5d9 !important;">
            Электронная очередь деканата
        </span>
    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold">Управление очередью</h1>
        <p class="text-secondary">
            Создавайте талоны и отслеживайте обращения студентов.
        </p>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         role="alert"
         th:text="${successMessage}">
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card main-card h-100">
                <div class="card-body p-4">
                    <div class="text-secondary">Ожидают обслуживания</div>
                    <div class="stat-number"
                         th:text="${waitingCount}">0</div>
                    <small class="text-secondary">
                        Талонов со статусом «Ожидает»
                    </small>
                </div>
            </div>
        </div>
<!--        <div class="col-md-8">-->
<!--            <div class="card main-card h-100">-->
<!--                <div class="card-body p-4">-->
<!--                    <h5 class="fw-bold">Как это работает?</h5>-->
<!--                    <p class="text-secondary mb-0">-->
<!--                        Вы заполняете форму, получаете номер талона,-->
<!--                        а заявка сохраняется в базе данных.-->
<!--                        Список ниже обновляется после перезагрузки страницы.-->
<!--                    </p>-->
<!--                </div>-->
<!--            </div>-->
<!--        </div>-->
    </div>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card main-card">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-3">Новый талон</h4>
                    <form th:action="@{/tickets}"
                          th:object="${ticketForm}"
                          method="post">

                        <div class="mb-3">
                            <label for="studentName"
                                   class="form-label">
                                Имя студента
                            </label>
                            <input id="studentName"
                                   type="text"
                                   class="form-control"
                                   th:field="*{studentName}"
                                   placeholder="Иван Иванов"
                                   maxlength="100"
                                   required>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('studentName')}"
                                 th:errors="*{studentName}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="category"
                                   class="form-label">
                                Причина обращения
                            </label>
                            <select id="category"
                                    class="form-select"
                                    th:field="*{category}"
                                    required>
                                <option value="">
                                    Выберите категорию
                                </option>
                                <option th:each="category : ${categories}"
                                        th:value="${category}"
                                        th:text="${category.label}">
                                </option>
                            </select>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('category')}"
                                 th:errors="*{category}">
                            </div>
                        </div>
                        <div class="form-check mb-4">
                            <input id="urgent"
                                   class="form-check-input"
                                   type="checkbox"
                                   th:field="*{urgent}">
                            <label class="form-check-label"
                                   for="urgent">
                                Срочное обращение
                            </label>
                        </div>
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Получить талон
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card main-card">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between
                                align-items-center mb-3">
                        <h4 class="fw-bold mb-0">Список талонов</h4>
                        <span class="badge text-bg-primary"
                              th:text="${#lists.size(tickets)}">
                            0
                        </span>
                    </div>
                    <div th:if="${#lists.isEmpty(tickets)}"
                         class="text-center py-5 text-secondary">
                        <h5>Очередь пока пуста</h5>
                        <p class="mb-0">
                            Создай первый талон с помощью формы.
                        </p>
                    </div>
                    <div th:unless="${#lists.isEmpty(tickets)}"
                         class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th>Талон</th>
                                <th>Студент</th>
                                <th>Категория</th>
                                <th>Статус</th>
                            </tr>
                            </thead>
<!--                            <tbody>-->
<!--                            <tr th:each="ticket : ${tickets}">-->
<!--                                <td>-->
<!--                                    <span class="ticket-number"-->
<!--                                          th:text="${ticket.ticketNumber}">-->
<!--                                        SQ-001-->
<!--                                    </span>-->
<!--                                    <div th:if="${ticket.urgent}"-->
<!--                                         class="urgent small">-->
<!--                                        Срочно-->
<!--                                    </div>-->
<!--                                </td>-->
<!--                                <td th:text="${ticket.studentName}">-->
<!--                                    Иван Иванов-->
<!--                                </td>-->
<!--                                <td th:text="${ticket.category.label}">-->
<!--                                    Получение справки-->
<!--                                </td>-->
<!--                                <td>-->
<!--                                    <span class="badge text-bg-warning"-->
<!--                                          th:if="${ticket.status.name() == 'WAITING'}"-->
<!--                                          th:text="${ticket.status.label}">-->
<!--                                        Ожидает-->
<!--                                    </span>-->
<!--                                    <span class="badge text-bg-info"-->
<!--                                          th:unless="${ticket.status.name() == 'WAITING'}"-->
<!--                                          th:text="${ticket.status.label}">-->
<!--                                        Другой статус-->
<!--                                    </span>-->
<!--                                </td>-->
<!--                            </tr>-->
<!--                            </tbody>-->
                        </table>
                    </div>
<!--                    <div class="text-secondary small mt-2">-->
<!--                        Обновите страницу, чтобы загрузить актуальное состояние очереди.-->
<!--                    </div>-->
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ВозьмиТалон</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="navbar">
    <div class="navbar-content">
        <div class="logo">ВозьмиТалон</div>
        <div class="nav-description">Электронная очередь деканата</div>
    </div>
</header>

<main class="container">

    <h1 class="page-title">Вход</h1>
    <p class="page-subtitle">
        Войдите в свой аккаунт, чтобы продолжить.
    </p>
    <div th:if="${param.error}" class="error-message auth-alert">
        Неверный логин или пароль.
    </div>
    <div th:if="${param.logout}" class="success-message auth-alert">
        Вы успешно вышли из аккаунта.
    </div>
    <div th:if="${successMessage}" class="success-message auth-alert"
         th:text="${successMessage}"></div>

    <section class="card auth-card">
        <h2 class="card-title">Вход в аккаунт</h2>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username">Логин</label>

                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Введите логин"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Введите пароль"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="submit-button">
                Войти
            </button>
        </form>

        <p class="auth-footer">
            Нет аккаунта?
            <a th:href="@{/register}" class="auth-link">Зарегистрироваться</a>
        </p>
    </section>

    <p class="auth-back">
        <a th:href="@{/}" class="auth-link">← На главную</a>
    </p>

</main>

</body>
</html>

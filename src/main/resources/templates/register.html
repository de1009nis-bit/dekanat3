<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — ВозьмиТалон</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="navbar">
    <div class="navbar-content">
        <div class="logo">ВозьмиТалон</div>
        <div class="nav-description">Электронная очередь деканата</div>
    </div>
</header>

<main class="container">

    <h1 class="page-title">Регистрация студента</h1>
    <p class="page-subtitle">
        Создайте аккаунт для работы с электронной очередью.
    </p>

    <section class="card auth-card">
        <h2 class="card-title">Создать аккаунт</h2>

        <form th:action="@{/register}"
              th:object="${registrationForm}"
              method="post">

            <div class="form-group">
                <label for="username">Логин</label>

                <input type="text"
                       id="username"
                       class="form-control"
                       th:field="*{username}"
                       placeholder="Придумайте логин">

                <div class="error-message"
                     th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>

                <input type="password"
                       id="password"
                       class="form-control"
                       th:field="*{password}"
                       placeholder="Минимум 6 символов">

                <div class="error-message"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">
                </div>
            </div>

            <div class="form-group">
                <label for="passwordConfirmation">Повторите пароль</label>

                <input type="password"
                       id="passwordConfirmation"
                       class="form-control"
                       th:field="*{passwordConfirmation}"
                       placeholder="Повторите пароль">

                <div class="error-message"
                     th:if="${#fields.hasErrors('passwordConfirmation')}"
                     th:errors="*{passwordConfirmation}">
                </div>
            </div>

            <button type="submit" class="submit-button">
                Зарегистрироваться
            </button>
        </form>

        <p class="auth-footer">
            Уже есть аккаунт?
            <a th:href="@{/login}" class="auth-link">Войти</a>
        </p>
    </section>

    <p class="auth-back">
        <a th:href="@{/}" class="auth-link">← На главную</a>
    </p>

</main>

</body>
</html>
